# TransitionGraph parameters (predictors/graph.py). Read by TransitionGraph.from_config().
# per_session_cap: max count of any (context -> target) pair from one session. Measured on
# full TraceLab (predictors/cap_sweep.py, results/p4_cap.csv): cap 3 vs none costs at most
# 0.9 pt top-1 (n-gram, fixed split; 0.0 GKF; ranker 0.1), under the 1-point rule -> keep 3.
min_support: 3
per_session_cap: 3        # null = no cap
max_events: 2000
max_order: 3
max_gap_ms: 3600000       # think gaps clipped to [0, 1 h] before winsorising
# rebuild() from logged traces
rebuild:
  max_new_share: 0.5      # logged sessions together weigh at most this x base sessions
  max_val_drop: 0.01      # reject the rebuilt graph if val top-1 drops by more
