{{- /*
Opt-in NetworkPolicy (issue #7 follow-up): only the gateway and the controller may open
connections to tool pods and predictor pods (stub skypiea-predictor and real skypiea-model).
Off by default (networkPolicy.enabled=false): nothing changes unless you turn it on.

Enforcement depends on the cluster's CNI; a CNI without NetworkPolicy support ignores these
objects silently. Enforcement was NOT verified on kind in this repo (see SECURITY.md).

With it on, everything else is refused at the network layer, including Prometheus scraping
tool / model pods, the E0 probe, and API-server service proxy calls (`skypiea policy`, which
reads the stub predictor's /admin/policy). Add sources for those in networkPolicy.extraFrom.
kubectl port-forward (the Live Console's loopback ports) does not pass through the pod network
and is not affected.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
{{- $ns := .Release.Namespace }}
{{- $ctx := dict "root" $ "name" "skypiea-network-policy" }}
{{- $tools := list }}
{{- range $name, $_ := .Values.tools }}{{- $tools = append $tools $name }}{{- end }}
{{- $targets := dict "skypiea-tools-ingress" $tools "skypiea-predictor-ingress" (list "skypiea-predictor" "skypiea-model") }}
{{- range $pname, $values := $targets }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $pname }}
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: skypiea.io/tool
        operator: In
        values: {{- toYaml $values | nindent 10 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {skypiea.io/tool: skypiea-gateway}}
        - podSelector: {matchLabels: {skypiea.io/tool: skypiea-controller}}
        {{- with $.Values.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
{{- end }}
