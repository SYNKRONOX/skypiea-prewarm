{{- if .Values.platform.enabled }}
{{- $p := .Values.platform }}
{{- $ns := .Release.Namespace }}
{{- $img := printf "%sskypiea/platform:%s" .Values.registry (toString (default .Values.imageTag .Values.platformImageTag)) }}
{{- $ctl := dict "root" $ "name" "skypiea-controller" }}
{{- $gw := dict "root" $ "name" "skypiea-gateway" }}
{{- $pr := dict "root" $ "name" "skypiea-predictor" }}
# ======================= controller (kopf) =======================
# Least privilege: read/patch Deployments (and their scale) in THIS namespace only; post events.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skypiea-controller
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $ctl | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skypiea-controller
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $ctl | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, patch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skypiea-controller
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $ctl | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: skypiea-controller}
subjects:
  - {kind: ServiceAccount, name: skypiea-controller, namespace: {{ $ns }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skypiea-controller
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $ctl | nindent 4 }}
spec:
  replicas: 1                 # single writer
  strategy: {type: Recreate}  # never two controllers at once
  selector:
    matchLabels: {skypiea.io/tool: skypiea-controller}
  template:
    metadata:
      labels: {{- include "skypiea.labels" $ctl | nindent 8 }}
      annotations:
        skypiea.io/metrics-port: "8081"
    spec:
      serviceAccountName: skypiea-controller
      enableServiceLinks: false
      terminationGracePeriodSeconds: 5
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: controller
          image: {{ $img }}
          imagePullPolicy: IfNotPresent
          command: [kopf, run, --standalone, --namespace, {{ $ns | quote }}, -m, controller.operator]
          ports: [{name: api, containerPort: 8081}]
          env:
            - {name: SKYPIEA_NAMESPACE, value: {{ $ns | quote }}}
            {{- with $p.classOverrides }}
            - {name: SKYPIEA_CLASS_OVERRIDES, value: {{ toJson . | quote }}}
            {{- end }}
            - {name: SKYPIEA_DEFAULT_TTL_S, value: {{ $p.controller.defaultTtlS | quote }}}
            - {name: SKYPIEA_PURGE_S, value: {{ $p.controller.purgeS | quote }}}
            - {name: SKYPIEA_MIN_DWELL_S, value: {{ $p.controller.minDwellS | quote }}}
            - {name: SKYPIEA_MAX_PER_TOOL, value: {{ $p.controller.maxPerTool | quote }}}
            - {name: SKYPIEA_MAX_TOTAL, value: {{ $p.controller.maxTotal | quote }}}
            - {name: SKYPIEA_ALWAYS_WARM, value: {{ $p.controller.alwaysWarm | quote }}}
            - {name: SKYPIEA_MAX_SCALEUPS_PER_NODE, value: {{ $p.controller.maxScaleUpsPerNode | quote }}}
            - {name: SKYPIEA_NODES, value: {{ $p.controller.nodes | quote }}}
          readinessProbe:
            httpGet: {path: /healthz, port: api}
            periodSeconds: 2
          resources: {{- toYaml $p.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 16Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: skypiea-controller
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $ctl | nindent 4 }}
spec:
  type: ClusterIP
  selector: {skypiea.io/tool: skypiea-controller}
  ports: [{name: api, port: 8081, targetPort: api}]
---
# ======================= gateway =======================
# Least privilege: read EndpointSlices (ready pods per tool) in THIS namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skypiea-gateway
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $gw | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: skypiea-gateway
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $gw | nindent 4 }}
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skypiea-gateway
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $gw | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: skypiea-gateway}
subjects:
  - {kind: ServiceAccount, name: skypiea-gateway, namespace: {{ $ns }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skypiea-gateway
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $gw | nindent 4 }}
spec:
  replicas: {{ $p.gateway.replicas }}
  selector:
    matchLabels: {skypiea.io/tool: skypiea-gateway}
  template:
    metadata:
      labels: {{- include "skypiea.labels" $gw | nindent 8 }}
      annotations:
        skypiea.io/metrics-port: "8080"
    spec:
      serviceAccountName: skypiea-gateway
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: {{ $img }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, gateway.main, gateway]
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: SKYPIEA_NAMESPACE, value: {{ $ns | quote }}}
            {{- with $p.classOverrides }}
            - {name: SKYPIEA_CLASS_OVERRIDES, value: {{ toJson . | quote }}}
            {{- end }}
            - {name: SKYPIEA_HOLD_MS, value: {{ $p.gateway.holdMs | quote }}}
            - {name: SKYPIEA_COLD_TIMEOUT_S, value: {{ $p.gateway.coldTimeoutS | quote }}}
            - {name: SKYPIEA_DEMAND_TTL_S, value: {{ $p.gateway.demandTtlS | quote }}}
            - {name: SKYPIEA_PREDICTOR_TIMEOUT_MS, value: {{ $p.gateway.predictorTimeoutMs | quote }}}
            - {name: SKYPIEA_SESSION_IDLE_S, value: {{ $p.gateway.sessionIdleS | quote }}}
            {{- if $p.gateway.turnHint }}
            - {name: SKYPIEA_TURN_HINT, value: "1"}
            {{- end }}
            {{- if $p.gateway.earlyConnect }}
            - {name: SKYPIEA_EARLY_CONNECT, value: "1"}
            {{- end }}
            - {name: SKYPIEA_CONTROLLER_URL, value: "http://skypiea-controller.{{ $ns }}.svc:8081"}
            {{- if $p.predictor.url }}
            - {name: SKYPIEA_PREDICTOR_URL, value: {{ $p.predictor.url | quote }}}
            {{- else if eq $p.predictor.serve "model" }}
            {{- if not $p.predictor.image.tag }}{{ fail "platform.predictor.serve=model needs platform.predictor.image.tag" }}{{ end }}
            - {name: SKYPIEA_PREDICTOR_URL, value: "http://skypiea-model.{{ $ns }}.svc:80"}
            {{- else if $p.predictor.enabled }}
            - {name: SKYPIEA_PREDICTOR_URL, value: "http://skypiea-predictor.{{ $ns }}.svc:80"}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
          resources: {{- toYaml $p.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 16Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: skypiea-gateway
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $gw | nindent 4 }}
spec:
  type: ClusterIP
  selector: {skypiea.io/tool: skypiea-gateway}
  ports: [{name: http, port: 80, targetPort: http}]
{{- if and $p.predictor.enabled (not $p.predictor.url) }}
---
# ======================= predictor PLACEHOLDER =======================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skypiea-predictor
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $pr | nindent 4 }}
    skypiea.io/placeholder: "true"
spec:
  replicas: 1
  selector:
    matchLabels: {skypiea.io/tool: skypiea-predictor}
  template:
    metadata:
      labels: {{- include "skypiea.labels" $pr | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: predictor
          image: {{ $img }}
          imagePullPolicy: IfNotPresent
          command: [python, -m, gateway.main, predictor]
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: SKYPIEA_POLICY, value: {{ $p.predictor.policy | quote }}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
          resources: {{- toYaml $p.predictor.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: skypiea-predictor
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $pr | nindent 4 }}
spec:
  type: ClusterIP
  selector: {skypiea.io/tool: skypiea-predictor}
  ports: [{name: http, port: 80, targetPort: http}]
{{- end }}
{{- with $p.predictor.image.tag }}
{{- if not $p.predictor.coldStartYaml }}{{ fail "platform.predictor.image.tag needs --set-file platform.predictor.coldStartYaml=configs/cold_start.yaml" }}{{ end }}
{{- if not (has $p.predictor.profile (list "coding" "support" "prd")) }}{{ fail "platform.predictor.profile must be coding, support or prd (SYNTHETIC)" }}{{ end }}
{{- $md := dict "root" $ "name" "skypiea-model" }}
---
# ======================= real predictor (feat/model services/predictor) =======================
apiVersion: v1
kind: ConfigMap
metadata:
  name: skypiea-model-cold-start
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $md | nindent 4 }}
data:
  cold_start.yaml: {{ $p.predictor.coldStartYaml | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skypiea-model
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $md | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {skypiea.io/tool: skypiea-model}
  template:
    metadata:
      labels: {{- include "skypiea.labels" $md | nindent 8 }}
      annotations:
        skypiea.io/metrics-port: "8090"
        skypiea.io/profile: {{ $p.predictor.profile | quote }}
        checksum/cold-start: {{ $p.predictor.coldStartYaml | sha256sum | trunc 12 | quote }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: predictor
          image: {{ printf "%s%s:%s" $.Values.registry $p.predictor.image.repository (toString .) }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8090}]
          env:
            - {name: PREDICTOR_PROFILE, value: {{ $p.predictor.profile | quote }}}
            - {name: COLD_START_PATH, value: /cold/cold_start.yaml}
            - {name: WORKERS, value: "1"}
            {{- with $p.predictor.decideOverrides }}
            - {name: PREDICTOR_DECIDE_OVERRIDES, value: {{ toJson . | quote }}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources: {{- toYaml $p.predictor.modelResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: cold, mountPath: /cold, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: cold, configMap: {name: skypiea-model-cold-start}}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: skypiea-model
  namespace: {{ $ns }}
  labels: {{- include "skypiea.labels" $md | nindent 4 }}
spec:
  type: ClusterIP
  selector: {skypiea.io/tool: skypiea-model}
  ports: [{name: http, port: 80, targetPort: http}]
{{- end }}
{{- end }}
