# Defaults shared by kind and AWS. values-kind.yaml / values-aws.yaml set ONLY the registry
# and the pull secret. The tool list mirrors tools/tool_map.yaml (checked by
# tests/test_chart_matches_tool_map.py).

# Prefix for image names, with trailing slash: "<registry>/" -> <registry>/skypiea/<tool>:<tag>
registry: ""
imageTag: latest          # set by make: --set imageTag=$(tools/image_tag.sh)
platformImageTag: ""      # optional: platform image (gateway/controller/predictor) tag; "" = imageTag
imagePullSecrets: []

replicas: 0               # initial count only; afterwards the Skypiea controller owns replicas
                          # (helm upgrade keeps the live count, see templates/tools.yaml)
defaultServiceMs: 20

readinessProbe:
  periodSeconds: 1
  failureThreshold: 60
  timeoutSeconds: 1

# Sized so ALL 16 tools at 1 replica fit on one 2 vCPU / 8 GiB node (k3s on m7i-flex.large)
# with headroom for 3 copies of 3 heavy tools:
#   requests 16 pods: 9x(50m,96Mi) + 4x(50m,192Mi) + 3x(75m,256Mi) = 875m, 2400Mi
#   +6 heavy copies:                                       + 450m, 1536Mi  => 1325m, 3936Mi
#   + platform (gateway, controller, predictor):            + 200m,  352Mi  => 1525m, 4288Mi
#   + monitoring (prometheus, grafana):                     + 150m,  448Mi  => 1675m, 4736Mi
#   (E0 runs with platform and monitoring disabled.)
# On the 2 vCPU VM, heavy tools starting together compete for CPU (see docs/infra.md).
# CPU limit is one full core so startup (CPU-bound imports) is not artificially throttled.
resources:
  light:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: "1", memory: 192Mi}
  medium:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: "1", memory: 384Mi}
  heavy:
    requests: {cpu: 75m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}

tools:
  user_lookup: {tier: light}
  order_lookup: {tier: medium}
  product_lookup: {tier: medium}
  order_update: {tier: light}
  refund_issue: {tier: light}
  policy_check: {tier: heavy}
  promo_code_lookup: {tier: light}
  travel_booking: {tier: medium}
  read_file: {tier: light}
  edit_file: {tier: light}
  format_diff: {tier: light}
  search: {tier: medium}
  shell: {tier: light}
  run_tests: {tier: heavy}
  post_comment: {tier: light}
  generic_fallback: {tier: heavy}

# Skypiea platform: gateway, controller, predictor placeholder (one image, skypiea/platform).
# All Services are ClusterIP (nothing exposed outside the cluster).
# E0 must run WITHOUT the controller (it scales tools itself): --set platform.enabled=false.
platform:
  enabled: true
  # Live console only (configs/live/console_tool_map.yaml): class -> server overrides on the
  # gateway and controller. Empty = tools/tool_map.yaml unchanged (every result, AWS).
  classOverrides: {}
  gateway:
    replicas: 1
    holdMs: 150              # FR-9
    coldTimeoutS: 120
    demandTtlS: 0            # a pod started by a call itself: scale-to-zero after use
    predictorTimeoutMs: 300
    sessionIdleS: 600
    turnHint: false          # POST /v1/hint turn-start prewarm hint (live console); off = 404
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 256Mi}
  controller:
    defaultTtlS: 30          # when a decision has no ttl_s
    purgeS: 5                # removed at TTL + 5 s (FR-3)
    minDwellS: 5
    maxPerTool: 3
    maxTotal: 20
    alwaysWarm: false        # always-warm baseline
    # Pods starting at once per node (0 = no limit); excess scale-ups queue by due time.
    # E0 on AWS (2 vCPU): 3 at once = 5.5 s median cached vs 2.7 s alone. See
    # docs/gateway_controller.md.
    maxScaleUpsPerNode: 2
    nodes: 1                 # schedulable nodes (the controller has no cluster-wide RBAC)
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 500m, memory: 256Mi}
  predictor:
    enabled: true            # stub (stand-in policies: scale_to_zero, always_warm, keep_alive, markov1)
    url: ""                  # set to use an external predictor instead of stub/model
    policy: scale_to_zero
    # Which predictor the gateway calls: stub (the baselines above) or model (the real
    # predictor, feat/model services/predictor; needs image.tag). Both run when image.tag is set.
    serve: stub
    # Real predictor: one image holds both bundles; profile selects one (P1, docs/model.md):
    # support = Scenario A, coding = Scenario B, prd = SYNTHETIC PRD A/B demo. Its cold-start
    # file is passed at deploy time:
    #   --set-file platform.predictor.coldStartYaml=configs/cold_start.yaml
    image: {repository: skypiea/predictor, tag: ""}   # "" = not deployed
    profile: support
    coldStartYaml: ""
    resources:
      requests: {cpu: 50m, memory: 96Mi}
      limits: {cpu: 500m, memory: 192Mi}
    modelResources:          # measured idle RSS 51-62 MiB per profile (docker stats, laptop)
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}

# Monitoring: Prometheus (scrapes every pod with a skypiea.io/metrics-port annotation in this
# namespace) and Grafana with the Skypiea dashboard provisioned (files/skypiea-dashboard.json).
# ClusterIP only: kubectl port-forward svc/skypiea-grafana 3000 (anonymous Viewer). The admin
# password is generated at install into Secret skypiea-grafana and never stored in the repo.
monitoring:
  enabled: true
  scrapeInterval: 5s          # tool pods live seconds to minutes
  # Live console (opt-in): also scrape these namespaces (read-only Role there) and add a
  # `namespace` label; provision the "Skypiea Live: baseline vs predictive" dashboard.
  extraNamespaces: []
  liveDashboard: false
  retention: 2d
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    resources:            # 256Mi was OOM-killed on kind during Grafana 13's first-start migrations
      requests: {cpu: 50m, memory: 192Mi}
      limits: {cpu: 500m, memory: 512Mi}

# Long-running in-cluster client used by E0 (experiments/e0_cold_start.py) so that the first
# MCP call is measured from inside the cluster.
e0Probe:
  enabled: false
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: "1", memory: 256Mi}
