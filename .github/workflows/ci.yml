name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Unit tests, lint and the 50 MB size check (no Docker, about 3 min).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip check
      - run: python tools/check_sizes.py
      - run: ruff check .
      - run: pytest -q
      - run: PYTHON=python bash tools/doctor.sh test

  # The whole stack on kind on a clean runner: make doctor, make demo (PRD Scenario A replay
  # under scale_to_zero and predictive), the agent with the SCRIPTED LLM (no Ollama, no GPU),
  # then every tool back to 0 replicas. See demo/ci_e2e.sh and docs/TESTING.md.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIND_VERSION: v0.33.0
      KUBECTL_VERSION: v1.37.2
      HELM_VERSION: v4.3.1
      # Free disk on hosted runners varies and can be below the 15 GB laptop guidance
      # (docs/DEMO.md); doctor's disk threshold is lowered to 10 GB here, and this job is the
      # check that the demo fits.
      DOCTOR_MIN_DISK_GB: "10"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (preinstalled SDKs the job does not use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Cache kind, kubectl, helm binaries
        id: bins
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: bins-${{ runner.os }}-kind-${{ env.KIND_VERSION }}-kubectl-${{ env.KUBECTL_VERSION }}-helm-${{ env.HELM_VERSION }}
      - name: Install kind, kubectl, helm (pinned)
        if: steps.bins.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -fsSLo ~/.local/bin/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo ~/.local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          mv /tmp/linux-amd64/helm ~/.local/bin/helm
          chmod +x ~/.local/bin/kind ~/.local/bin/kubectl ~/.local/bin/helm
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make setup PYTHON=python
      - name: make doctor
        run: make doctor DOCTOR_MODE=demo PYTHON=python
      - name: End to end (demo/ci_e2e.sh)
        run: demo/ci_e2e.sh
      - name: Upload demo logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-demo-logs
          path: |
            .demo/*.log
            .demo/*.md
            .demo/agent_runs/
          if-no-files-found: ignore
          retention-days: 7
